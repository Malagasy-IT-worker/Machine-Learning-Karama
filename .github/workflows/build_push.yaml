name: Build Docker Images
run-name: Build Docker Images pipeline triggered by ${{ github.actor }} on branch ${{ github.ref_name }}

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed
    branches:
      - develop

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      hex_tag: ${{ steps.generate.outputs.hex_tag }}
      model_run_id: ${{ steps.get-run-id.outputs.model_run_id }} # Nouvelle sortie
    steps:
      - name: Generate build tag
        id: generate
        run: echo "hex_tag=$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get Retrain model run ID # Nouvelle étape
        id: get-run-id
        run: |
          RUN_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" \
            | jq '.workflow_run_id')
          echo "model_run_id=$RUN_ID" >> $GITHUB_OUTPUT

  build-and-push-api:
    needs: generate-tag
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
          run-id: ${{ needs.generate-tag.outputs.model_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ankoayfeno/api_ml_karama:${{ needs.generate-tag.outputs.hex_tag }}
            ankoayfeno/api_ml_karama:latest
          build-args: ENVIRONMENT=prod

  build-and-push-frontend:
    needs: generate-tag
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image for dev
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ankoayfeno/ml_karama:dev-${{ needs.generate-tag.outputs.hex_tag }}
            ankoayfeno/ml_karama:dev-latest
          target: development

      - name: Build and push frontend image for prod
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ankoayfeno/ml_karama:prod-${{ needs.generate-tag.outputs.hex_tag }}
            ankoayfeno/ml_karama:prod-latest
          target: production
