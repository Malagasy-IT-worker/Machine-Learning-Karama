name: Deploy Dev
run-name: Deploy Dev
on:
  workflow_run:
    workflows:
      - Build Docker Images
    types:
      - completed

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy Dev pipeline triggered by ${{ github.actor }} on branch ${{ github.ref }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Dev server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc"
          SOURCE: "./docker-compose.yml"
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          TARGET: "/home/${{ vars.REMOTE_USER }}/ml_karama/"
          SCRIPT_BEFORE: |
            sudo mkdir -p /home/${{ secrets.REMOTE_USER }}/ml_karama/
          SCRIPT_AFTER: |
            sudo docker compose -f "/home/${{ vars.REMOTE_USER }}/ml_karama/docker-compose.yml" --profile prod pull && \
            sudo docker compose -f "/home/${{ vars.REMOTE_USER }}/ml_karama/docker-compose.yml" --profile prod up -d
