jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les variables
        run: |
          echo "API URL: '$deploy_dev_api_url'"
          echo "Client URL: '$deploy_dev_client_url'"
        env:
          deploy_dev_api_url: ${{ vars.RENDER_DEPLOY_HOOK_API_URL }}
          deploy_dev_client_url: ${{ vars.RENDER_DEPLOY_HOOK_CLIENT_URL }}

      - name: Deploy
        env:
          deploy_dev_api_url: ${{ vars.RENDER_DEPLOY_HOOK_URL }}
          # deploy_dev_client_url: ${{ vars.RENDER_DEPLOY_HOOK_CLIENT_URL }}
        run: |
          echo "Déploiement API..."
          curl -sSL "$deploy_dev_api_url"

