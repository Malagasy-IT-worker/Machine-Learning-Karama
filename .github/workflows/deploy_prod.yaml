jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          deploy_dev_api_url: ${{ secrets.RENDER_DEPLOY_HOOK_API_URL }}
          deploy_dev_url: ${{ secret.RENDER_DEPLOY_HOOK_CLIENT_URL }}
        run: |
          curl "$deploy_dev_api_url"
          curl "$deploy_dev_client_url"